name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu 24.04 (install + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check shell scripts
        run: bash -n install.sh && bash -n uninstall.sh

      - name: Install with install.sh
        run: ./install.sh --yes

      - name: Install test tools
        run: sudo apt-get install -y python3-pytest xvfb desktop-file-utils

      - name: Validate desktop launcher
        run: desktop-file-validate ~/.local/share/applications/io.github.magickstudio.MagickStudio.desktop

      - name: Run tests (GUI test on Xvfb)
        env:
          MAGICK_STUDIO_REQUIRE_ALL: "1"   # fail instead of skipping GUI and cwebp tests
        run: GDK_BACKEND=x11 xvfb-run -a /usr/bin/python3 -m pytest -v tests

      - name: Uninstall
        run: |
          ./uninstall.sh
          test ! -e ~/.local/bin/magick-studio
          test ! -e ~/.local/share/magick-studio/main.py

  containers:
    name: ${{ matrix.image }} (tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "fedora:44"]
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3-gi gir1.2-gtk-4.0 \
              gir1.2-adw-1 imagemagick webp python3-pytest xvfb xauth
          else
            dnf install -y python3-gobject gtk4 libadwaita gobject-introspection ImageMagick libwebp-tools \
              python3-pytest xorg-x11-server-Xvfb xauth
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run tests (GUI test on Xvfb)
        env:
          MAGICK_STUDIO_REQUIRE_ALL: "1"   # fail instead of skipping GUI and cwebp tests
        run: GDK_BACKEND=x11 xvfb-run -a python3 -m pytest -v tests
